<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电路方程列写规律演示 - 三网孔电路</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style type="text/tailwindcss">
        @layer base {
            body {
                font-family: 'Noto Serif SC', serif;
                background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            }
            .math-font {
                font-family: 'Noto Serif SC', serif;
                font-style: italic;
            }
            .mono-font {
                font-family: 'JetBrains Mono', monospace;
            }
        }
        @layer components {
            .glass-panel {
                background: rgba(255, 255, 255, 0.95);
                backdrop-filter: blur(10px);
                border: 1px solid rgba(255, 255, 255, 0.2);
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            }
            .circuit-element {
                transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
                cursor: pointer;
            }
            .circuit-element:hover {
                filter: drop-shadow(0 0 8px #3b82f6);
                transform: scale(1.05);
            }
            .highlight-pulse {
                animation: pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            }
            @keyframes pulse-glow {
                0%, 100% { opacity: 1; filter: drop-shadow(0 0 5px currentColor); }
                50% { opacity: 0.7; filter: drop-shadow(0 0 15px currentColor); }
            }
            .matrix-bracket {
                position: relative;
                padding: 0 20px;
            }
            .matrix-bracket::before,
            .matrix-bracket::after {
                content: '';
                position: absolute;
                top: 0;
                bottom: 0;
                width: 3px;
                background: #1e293b;
                border-radius: 2px;
            }
            .matrix-bracket::before {
                left: 0;
                border-right: 1px solid #475569;
            }
            .matrix-bracket::after {
                right: 0;
                border-left: 1px solid #475569;
            }
            .equation-term {
                display: inline-block;
                padding: 4px 12px;
                margin: 2px;
                border-radius: 6px;
                font-weight: 600;
                transition: all 0.3s ease;
            }
            .term-self {
                background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
                color: white;
                box-shadow: 0 4px 6px -1px rgba(220, 38, 38, 0.3);
            }
            .term-mutual {
                background: linear-gradient(135deg, #ea580c 0%, #c2410c 100%);
                color: white;
                box-shadow: 0 4px 6px -1px rgba(234, 88, 12, 0.3);
            }
            .term-const {
                background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
                color: white;
                box-shadow: 0 4px 6px -1px rgba(124, 58, 237, 0.3);
            }
            .term-variable {
                background: linear-gradient(135deg, #059669 0%, #047857 100%);
                color: white;
                box-shadow: 0 4px 6px -1px rgba(5, 150, 105, 0.3);
            }
            .step-card {
                background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
                border-left: 4px solid #3b82f6;
                transition: all 0.3s ease;
            }
            .step-card:hover {
                transform: translateX(5px);
                box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            }
            .rule-box {
                background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
                color: #e2e8f0;
                border-radius: 12px;
                position: relative;
                overflow: hidden;
            }
            .rule-box::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                height: 3px;
                background: linear-gradient(90deg, #3b82f6, #8b5cf6, #ec4899);
            }
            .loop-arrow {
                fill: none;
                stroke-width: 2.5;
                marker-end: url(#arrowhead);
                opacity: 0;
                transition: opacity 0.5s ease;
            }
            .loop-arrow.active {
                opacity: 0.8;
                animation: dash 2s linear infinite;
            }
            @keyframes dash {
                to { stroke-dashoffset: -20; }
            }
            .btn-primary {
                background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
                transition: all 0.3s ease;
            }
            .btn-primary:hover {
                transform: translateY(-2px);
                box-shadow: 0 10px 20px -5px rgba(59, 130, 246, 0.4);
            }
            .btn-secondary {
                background: linear-gradient(135deg, #64748b 0%, #475569 100%);
                transition: all 0.3s ease;
            }
            .node-dot {
                filter: drop-shadow(0 0 6px currentColor);
            }
            .fade-in {
                animation: fadeIn 0.5s ease-in;
            }
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
            }
        }
    </style>
</head>
<body class="min-h-screen py-8 px-4">
    <div class="max-w-7xl mx-auto">
        <!-- 标题区域 -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-white mb-2 tracking-tight">电路方程列写规律演示系统</h1>
            <p class="text-slate-400 text-lg">三网孔电路的节点电压法与回路电流法矩阵方程 Ax=b 形式</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- 左侧：电路图 -->
            <div class="glass-panel rounded-2xl p-6">
                <h2 class="text-2xl font-bold text-slate-800 mb-4 flex items-center">
                    <span class="w-2 h-8 bg-blue-500 rounded-full mr-3"></span>
                    电路拓扑结构
                </h2>
                <div class="bg-white rounded-xl p-4 shadow-inner">
                    <svg viewBox="0 0 700 500" class="w-full h-auto" id="circuitSvg">
                        <defs>
                            <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                                <polygon points="0 0, 10 3, 0 6" fill="#3b82f6" />
                            </marker>
                            <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                                <polygon points="0 0, 10 3, 0 6" fill="#dc2626" />
                            </marker>
                            <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                                <polygon points="0 0, 10 3, 0 6" fill="#059669" />
                            </marker>
                            <linearGradient id="resistorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" style="stop-color:#e2e8f0;stop-opacity:1" />
                                <stop offset="50%" style="stop-color:#f8fafc;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
                            </linearGradient>
                        </defs>

                        <!-- 背景网格 -->
                        <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
                            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="0.5"/>
                        </pattern>
                        <rect width="700" height="500" fill="url(#grid)" />

                        <!-- 参考节点（地）在底部 -->
                        <g id="ground">
                            <!-- 地线 -->
                            <line x1="200" y1="420" x2="500" y2="420" stroke="#334155" stroke-width="2"/>
                            <!-- 接地符号 -->
                            <line x1="200" y1="420" x2="200" y2="440" stroke="#334155" stroke-width="3"/>
                            <line x1="190" y1="440" x2="210" y2="440" stroke="#334155" stroke-width="3"/>
                            <line x1="195" y1="450" x2="205" y2="450" stroke="#334155" stroke-width="2"/>
                            <line x1="197" y1="458" x2="203" y2="458" stroke="#334155" stroke-width="2"/>
                            
                            <line x1="350" y1="420" x2="350" y2="440" stroke="#334155" stroke-width="3"/>
                            <line x1="340" y1="440" x2="360" y2="440" stroke="#334155" stroke-width="3"/>
                            <line x1="345" y1="450" x2="355" y2="450" stroke="#334155" stroke-width="2"/>
                            <line x1="347" y1="458" x2="353" y2="458" stroke="#334155" stroke-width="2"/>
                            
                            <line x1="500" y1="420" x2="500" y2="440" stroke="#334155" stroke-width="3"/>
                            <line x1="490" y1="440" x2="510" y2="440" stroke="#334155" stroke-width="3"/>
                            <line x1="495" y1="450" x2="505" y2="450" stroke="#334155" stroke-width="2"/>
                            <line x1="497" y1="458" x2="503" y2="458" stroke="#334155" stroke-width="2"/>
                            
                            <text x="375" y="455" class="mono-font" font-size="14" fill="#475569" font-weight="600">参考节点 (0)</text>
                        </g>

                        <!-- 节点1 - 左上 -->
                        <circle cx="200" cy="120" r="8" fill="#dc2626" stroke="#991b1b" stroke-width="3" class="circuit-element node-dot" id="node1"/>
                        <text x="185" y="105" class="mono-font" font-size="16" fill="#dc2626" font-weight="700">节点 1</text>
                        <text x="215" y="125" class="mono-font" font-size="12" fill="#64748b">Un₁</text>

                        <!-- 节点2 - 右上 -->
                        <circle cx="500" cy="120" r="8" fill="#dc2626" stroke="#991b1b" stroke-width="3" class="circuit-element node-dot" id="node2"/>
                        <text x="515" y="105" class="mono-font" font-size="16" fill="#dc2626" font-weight="700">节点 2</text>
                        <text x="485" y="125" class="mono-font" font-size="12" fill="#64748b">Un₂</text>

                        <!-- 节点3 - 中间 -->
                        <circle cx="350" cy="270" r="8" fill="#dc2626" stroke="#991b1b" stroke-width="3" class="circuit-element node-dot" id="node3"/>
                        <text x="365" y="265" class="mono-font" font-size="16" fill="#dc2626" font-weight="700">节点 3</text>
                        <text x="335" y="290" class="mono-font" font-size="12" fill="#64748b">Un₃</text>

                        <!-- 支路1: R1 连接节点1和节点3 -->
                        <!-- 导线从节点1到电阻R1起点 -->
                        <line x1="200" y1="120" x2="240" y2="160" stroke="#334155" stroke-width="3" class="circuit-element" id="line-R1-1"/>
                        <!-- 电阻R1放置在导线中间 -->
                        <rect x="240" y="160" width="30" height="16" fill="url(#resistorGrad)" stroke="#475569" stroke-width="2" rx="2" class="circuit-element" id="R1"/>
                        <text x="225" y="175" font-size="13" fill="#1e293b" font-weight="600">R₁=10Ω</text>
                        <!-- 导线从电阻R1终点到节点3 -->
                        <line x1="270" y1="160" x2="350" y2="270" stroke="#334155" stroke-width="3" class="circuit-element" id="line-R1-2"/>

                        <!-- 支路2: R2 连接节点2和节点3 -->
                        <!-- 导线从节点2到电阻R2起点 -->
                        <line x1="500" y1="120" x2="460" y2="160" stroke="#334155" stroke-width="3" class="circuit-element" id="line-R2-1"/>
                        <!-- 电阻R2放置在导线中间 -->
                        <rect x="430" y="160" width="30" height="16" fill="url(#resistorGrad)" stroke="#475569" stroke-width="2" rx="2" class="circuit-element" id="R2"/>
                        <text x="445" y="175" font-size="13" fill="#1e293b" font-weight="600">R₂=20Ω</text>
                        <!-- 导线从电阻R2终点到节点3 -->
                        <line x1="430" y1="160" x2="350" y2="270" stroke="#334155" stroke-width="3" class="circuit-element" id="line-R2-2"/>

                        <!-- 支路3: R3 连接节点1和节点2 (顶部) -->
                        <line x1="200" y1="120" x2="500" y2="120" stroke="#334155" stroke-width="3" class="circuit-element" id="line-R3"/>
                        <rect x="335" y="112" width="30" height="16" fill="url(#resistorGrad)" stroke="#475569" stroke-width="2" rx="2" class="circuit-element" id="R3"/>
                        <text x="350" y="85" font-size="13" fill="#1e293b" font-weight="600">R₃=30Ω</text>

                        <!-- 支路4: R4 连接节点3和地 -->
                        <line x1="350" y1="270" x2="350" y2="420" stroke="#334155" stroke-width="3" class="circuit-element" id="line-R4"/>
                        <rect x="340" y="330" width="20" height="30" fill="url(#resistorGrad)" stroke="#475569" stroke-width="2" rx="2" transform="rotate(90 350 345)" class="circuit-element" id="R4"/>
                        <text x="365" y="345" font-size="13" fill="#1e293b" font-weight="600">R₄=40Ω</text>

                        <!-- 支路5: 电流源 Is 连接节点1和地 -->
                        <line x1="200" y1="120" x2="200" y2="250" stroke="#334155" stroke-width="3" class="circuit-element" id="line-Is-top"/>
                        <line x1="200" y1="290" x2="200" y2="420" stroke="#334155" stroke-width="3" class="circuit-element" id="line-Is-bottom"/>
                        <circle cx="200" cy="270" r="18" fill="#3b82f6" stroke="#2563eb" stroke-width="2" class="circuit-element" id="Is"/>
                        <text x="200" y="275" font-size="14" fill="white" font-weight="bold" text-anchor="middle">↑</text>
                        <text x="160" y="275" font-size="13" fill="#1e293b" font-weight="600">Iₛ=5A</text>

                        <!-- 支路6: 电压源 U1 连接节点2和地 -->
                        <line x1="500" y1="120" x2="500" y2="212" stroke="#334155" stroke-width="3" class="circuit-element" id="line-U1-top"/>
                        <line x1="500" y1="248" x2="500" y2="420" stroke="#334155" stroke-width="3" class="circuit-element" id="line-U1-bottom"/>
                        <circle cx="500" cy="230" r="18" fill="#059669" stroke="#047857" stroke-width="2" class="circuit-element" id="U1"/>
                        <text x="500" y="235" font-size="14" fill="white" font-weight="bold" text-anchor="middle">+</text>
                        <text x="530" y="235" font-size="13" fill="#1e293b" font-weight="600">U₁=10V</text>
                        <line x1="485" y1="212" x2="515" y2="212" stroke="#334155" stroke-width="2"/>
                        <line x1="485" y1="248" x2="515" y2="248" stroke="#334155" stroke-width="2"/>

                        <!-- 回路电流箭头和标注 -->
                        <!-- 回路1 (左网孔: 节点1-节点3-地-节点1) -->
                        <path d="M 240 140 A 80 80 0 1 1 320 300" stroke="#3b82f6" fill="none" 
                              class="loop-arrow" id="loop1-arrow" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
                        <text x="240" y="185" font-size="16" fill="#3b82f6" font-weight="700" id="loop1-label" opacity="0">Iₗ₁</text>

                        <!-- 回路2 (上网孔: 节点1-节点2-节点3-节点1) -->
                        <path d="M 350 100 A 50 50 0 1 1 450 100" stroke="#dc2626" fill="none" 
                              class="loop-arrow" id="loop2-arrow" stroke-dasharray="5,5" marker-end="url(#arrowhead-red)"/>
                        <text x="350" y="95" font-size="16" fill="#dc2626" font-weight="700" id="loop2-label" opacity="0">Iₗ₂</text>

                        <!-- 回路3 (右网孔: 节点2-地-节点3-节点2) -->
                        <path d="M 470 140 A 70 70 0 1 0 470 380" stroke="#059669" fill="none" 
                              class="loop-arrow" id="loop3-arrow" stroke-dasharray="5,5" marker-end="url(#arrowhead-green)"/>
                        <text x="480" y="260" font-size="16" fill="#059669" font-weight="700" id="loop3-label" opacity="0">Iₗ₃</text>
                    </svg>
                </div>
                
                <!-- 图例 -->
                <div class="mt-4 flex flex-wrap gap-4 text-sm">
                    <div class="flex items-center gap-2">
                        <div class="w-4 h-4 rounded-full bg-red-600"></div>
                        <span class="text-slate-700">独立节点</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="w-4 h-4 rounded bg-slate-200 border border-slate-400"></div>
                        <span class="text-slate-700">电阻</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="w-4 h-4 rounded-full bg-blue-500"></div>
                        <span class="text-slate-700">电流源</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="w-4 h-4 rounded-full bg-emerald-600"></div>
                        <span class="text-slate-700">电压源</span>
                    </div>
                </div>
            </div>

            <!-- 右侧：控制面板和演示区 -->
            <div class="space-y-4">
                <!-- 控制按钮 -->
                <div class="glass-panel rounded-2xl p-6">
                    <h3 class="text-lg font-bold text-slate-800 mb-4">分析方法选择</h3>
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="showNodeVoltage()" id="nodeBtn" 
                                class="btn-primary text-white py-3 px-4 rounded-xl font-semibold flex items-center justify-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                            </svg>
                            节点电压法
                        </button>
                        <button onclick="showLoopCurrent()" id="loopBtn"
                                class="btn-primary text-white py-3 px-4 rounded-xl font-semibold flex items-center justify-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                            </svg>
                            回路电流法
                        </button>
                        <button onclick="resetDemo()" 
                                class="btn-secondary text-white py-3 px-4 rounded-xl font-semibold col-span-2 flex items-center justify-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                            </svg>
                            重置演示
                        </button>
                    </div>
                </div>

                <!-- 演示区域 -->
                <div class="glass-panel rounded-2xl p-6 min-h-[500px]" id="demoArea">
                    <div class="h-full flex items-center justify-center text-slate-400">
                        <div class="text-center">
                            <svg class="w-16 h-16 mx-auto mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
                            </svg>
                            <p class="text-lg">点击上方按钮开始演示</p>
                            <p class="text-sm mt-2">查看节点电压法或回路电流法的矩阵方程列写规律</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 电路参数
        const params = {
            R1: 10, R2: 20, R3: 30, R4: 40,
            Is: 5, U1: 10
        };

        // 计算电导
        const G1 = 1/params.R1, G2 = 1/params.R2, 
              G3 = 1/params.R3, G4 = 1/params.R4;

        let currentMode = null;

        function resetDemo() {
            console.log("重置演示...");
            currentMode = null;
            document.getElementById('demoArea').innerHTML = `
                <div class="h-full flex items-center justify-center text-slate-400">
                    <div class="text-center">
                        <svg class="w-16 h-16 mx-auto mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
                        </svg>
                        <p class="text-lg">点击上方按钮开始演示</p>
                        <p class="text-sm mt-2">查看节点电压法或回路电流法的矩阵方程列写规律</p>
                    </div>
                </div>
            `;
            document.getElementById('nodeBtn').disabled = false;
            document.getElementById('loopBtn').disabled = false;
            
            // 清除高亮
            document.querySelectorAll('.highlight-pulse').forEach(el => el.classList.remove('highlight-pulse'));
            document.querySelectorAll('.loop-arrow').forEach(el => {
                el.classList.remove('active');
                el.style.opacity = '0';
            });
            document.querySelectorAll('[id$="-label"]').forEach(el => el.style.opacity = '0');
        }

        function highlightElement(id, showLoops = false) {
            document.querySelectorAll('.highlight-pulse').forEach(el => el.classList.remove('highlight-pulse'));
            const el = document.getElementById(id);
            if (el) el.classList.add('highlight-pulse');

            if (showLoops) {
                document.querySelectorAll('.loop-arrow').forEach((arrow, idx) => {
                    if (idx < 3) {
                        arrow.classList.add('active');
                        arrow.style.opacity = '0.8';
                    }
                });
                ['loop1-label', 'loop2-label', 'loop3-label'].forEach(id => {
                    document.getElementById(id).style.opacity = '1';
                });
            }
        }

        async function showNodeVoltage() {
            console.log("显示节点电压法演示...");
            if (currentMode === 'node') return;
            currentMode = 'node';
            document.getElementById('nodeBtn').disabled = true;
            document.getElementById('loopBtn').disabled = false;

            const demoArea = document.getElementById('demoArea');
            
            // 步骤1: 展示矩阵方程
            demoArea.innerHTML = `
                <div class="space-y-4">
                    <div class="flex items-center gap-2 mb-4">
                        <span class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-sm font-semibold">步骤 1/4</span>

                            <div class="text-slate-400 mb-2">本例计算：</div>
                            <div class="grid grid-cols-1 gap-1 text-slate-200">
                                <div>R₁₂ = R₂₁ = -R₁ = <span class="text-orange-400 font-bold">-10 Ω</span> （回路1、2公共支路R₁）</div>
                                <div>R₁₃ = R₃₁ = -R₄ = <span class="text-orange-400 font-bold">-40 Ω</span> （回路1、3公共支路R₄）</div>

                            </div>
                        </div>
                    </div>
                </div>
            `;

            await new Promise(r => setTimeout(r, 2000));
            highlightElement('U1', true);

            // 步骤4: 右边常数项规律
            demoArea.innerHTML += `
                <div class="space-y-4 mt-4 fade-in">

                            <li class="flex items-start gap-2">
                                <span class="text-purple-400 font-bold">②</span>
                                <span><strong class="text-green-400">符号规定</strong>：沿回路电流方向，电压源从负极到正极（电压升）为正，反之为负</span>
                            </li>
                            <li class="flex items-start gap-2">
                                <span class="text-purple-400 font-bold">③</span>

                        <div class="mt-4 bg-slate-800/50 p-3 rounded-lg mono-font text-sm">

                            <div class="grid grid-cols-1 gap-1 text-slate-200">
                                <div>uₛ₁ = Iₛ×R₁ = 5×10 = <span class="text-purple-400 font-bold">50 V</span> （电流源等效电压升）</div>
                                <div>uₛ₂ = U₁ = <span class="text-purple-400 font-bold">10 V</span> （电压源U₁在回路2中为电压升）</div>
                                <div>uₛ₃ = -U₁ = <span class="text-purple-400 font-bold">-10 V</span> （电压源U₁在回路3中为电压降）</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
